name: RexBoing
options:
  bundleIdPrefix: com.rexyrex
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_ABOUT_MISSING_NEWLINE: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO

targets:
  RexBoing:
    type: application
    platform: macOS
    sources:
      - path: RexBoing
        excludes:
          - "Info.plist"
          - "RexBoing.entitlements"
    settings:
      base:
        PRODUCT_NAME: "Rex Boing"
        # The identifier predates the name and stays: it is the preferences
        # domain, the login-item registration and the key the status item's
        # position is saved under, so changing it would reset all three on
        # every Mac the app is already installed on.
        PRODUCT_BUNDLE_IDENTIFIER: com.rexyrex.Zoomies
        INFOPLIST_FILE: RexBoing/Info.plist
        CODE_SIGN_ENTITLEMENTS: RexBoing/RexBoing.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - sdk: IOKit.framework
      - sdk: ServiceManagement.framework

schemes:
  RexBoing:
    build:
      targets:
        RexBoing: all
    run:
      config: Debug
    archive:
      config: Release
